context_and_goal: | 
  This is an optimization task for the time series cardiac arrest dataset.
  The goal is to produce useful features to predict if a patient's outcome can be predicted by monitoring their suppression ratio during an EEG.
  The outcome predictions are done by an external program. Our goal is to identify which patients are eligible for this kind of monitoring.
  The dataset contains log events from ICU stays of patients who experienced cardiac arrest.
  Each row represents a log event with various attributes and contains the following columns:
  - id: Unique identifier for each patient.
  - name/drug: Name of the log event or the drug administered. This indicates the type of measurement, observation, or medication recorded. NOTE the slash: the column is literally called "name/drug", not "name".
  - result/dose: Result of the log event, or the dose administered. This is the value or outcome of the measurement. NOTE the slash: the column is literally called "result/dose", not "result".
  - unit: Unit of measurement for the result (this may be empty if not applicable).
  - relative_sec: Time of the event in SECONDS since the start of that patient's record. There is no column called "time".
  - route: Administration route for medication rows (e.g. IV); empty for observation rows.

  Use these exact column names. Writing df['name'], df['result'] or df['time'] raises a KeyError -- those columns do not exist.
